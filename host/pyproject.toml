[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dbrain-host"
version = "0.1.0"
description = "Host tools for DBrain: network compiler, reference simulator, gateway"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
dashboard = ["websockets>=11"]
test = ["pytest>=7"]

[project.scripts]
dbrain = "dbrain.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dbrain*"]
